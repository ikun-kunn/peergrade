services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peergrade
      POSTGRES_USER: peergrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peergrade -d peergrade"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  # 一次性版本迁移：manage.py 会 import app，故必须传齐 web 的全套环境变量。
  init:
    build: .
    command: ["python", "manage.py", "upgrade-db"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL DATABASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set an HTTPS public origin}
      COOKIE_SECURE: 'true'
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL DATABASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set an HTTPS public origin}
      COOKIE_SECURE: 'true'
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # 等待数据库达到当前版本后再启动代理。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set a public DNS hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
  caddy_config:
