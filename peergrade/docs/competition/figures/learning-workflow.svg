<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="690" viewBox="0 0 1600 690" role="img" aria-label="证据驱动互评流程">
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10.8" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#4b7963"/></marker><marker id="blue-arrow" viewBox="0 0 12 12" refX="10.8" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#285779"/></marker></defs>
<rect width="1600" height="690" fill="#ffffff"/>
<text x="55" y="63" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="42" fill="#18382e" font-weight="600" text-anchor="start">证据驱动互评流程</text>
<text x="56" y="105" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#526a61" font-weight="400" text-anchor="start">同一个任务从教师建任务到学生修订；反馈发布后原作业与正式评价保持不变</text>
<polyline points="281,315 306,315" fill="none" stroke="#4b7963" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="57" y="228" width="224" height="180" rx="15" fill="#f3f8f4" stroke="#aac8b2" stroke-width="2"/>
<text x="75" y="265" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="22" fill="#286447" font-weight="600" text-anchor="start">01  教师</text>
<text x="75" y="317" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#18382e" font-weight="600" text-anchor="start">建班与任务</text>
<text x="75" y="354" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">量规、名单、截止</text>
<polyline points="534,315 559,315" fill="none" stroke="#4b7963" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="310" y="228" width="224" height="180" rx="15" fill="#f3f8f4" stroke="#aac8b2" stroke-width="2"/>
<text x="328" y="265" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="22" fill="#286447" font-weight="600" text-anchor="start">02  学生</text>
<text x="328" y="317" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#18382e" font-weight="600" text-anchor="start">文字 / PDF 提交</text>
<text x="328" y="354" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">服务端保存</text>
<text x="328" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">提取文本</text>
<polyline points="787,315 812,315" fill="none" stroke="#4b7963" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="563" y="228" width="224" height="180" rx="15" fill="#f3f8f4" stroke="#aac8b2" stroke-width="2"/>
<text x="581" y="265" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="22" fill="#286447" font-weight="600" text-anchor="start">03  系统</text>
<text x="581" y="317" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#18382e" font-weight="600" text-anchor="start">匿名双评分配</text>
<text x="581" y="354" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">每人评两份</text>
<text x="581" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">被评两次</text>
<polyline points="1040,315 1065,315" fill="none" stroke="#4b7963" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="816" y="228" width="224" height="180" rx="15" fill="#f3f8f4" stroke="#aac8b2" stroke-width="2"/>
<text x="834" y="265" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="22" fill="#286447" font-weight="600" text-anchor="start">04  学生</text>
<text x="834" y="317" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#18382e" font-weight="600" text-anchor="start">原文与结构化评语</text>
<text x="834" y="354" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">选区锚定</text>
<text x="834" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">可选 AI 检测</text>
<polyline points="1293,315 1318,315" fill="none" stroke="#4b7963" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1069" y="228" width="224" height="180" rx="15" fill="#f3f8f4" stroke="#aac8b2" stroke-width="2"/>
<text x="1087" y="265" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="22" fill="#286447" font-weight="600" text-anchor="start">05  教师</text>
<text x="1087" y="317" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#18382e" font-weight="600" text-anchor="start">结束并发布</text>
<text x="1087" y="354" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">分歧提示</text>
<text x="1087" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">匿名反馈</text>
<rect x="1322" y="228" width="224" height="180" rx="15" fill="#f3f8f4" stroke="#aac8b2" stroke-width="2"/>
<text x="1340" y="265" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="22" fill="#286447" font-weight="600" text-anchor="start">06  学生</text>
<text x="1340" y="317" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#18382e" font-weight="600" text-anchor="start">采纳与修订</text>
<text x="1340" y="354" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">独立版本</text>
<text x="1340" y="381" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="19" fill="#526a61" font-weight="400" text-anchor="start">历史轨迹</text>
<rect x="57" y="465" width="1490" height="115" rx="12" fill="#ffffff" stroke="#cadbd0" stroke-width="2"/>
<text x="82" y="503" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="24" fill="#286447" font-weight="600" text-anchor="start">业务状态约束</text>
<text x="82" y="540" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#526a61" font-weight="400" text-anchor="start">提交截止且至少三份有效作业后开启互评；全部评完或互评截止后教师方可发布。</text>
<text x="82" y="567" font-family="'Microsoft YaHei','Noto Sans CJK SC','Segoe UI',sans-serif" font-size="23" fill="#526a61" font-weight="400" text-anchor="start">学生作品分数由人工评价决定；AI 只提示评语质量；模型不可用时仍可保存并提交。</text>
</svg>